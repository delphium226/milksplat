[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1

# Image decoding (user textures) is very slow unoptimised (seconds for an
# 8192x8192 PNG in a debug build). Optimise just the codec crates.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
# 8x8 bitmap glyphs for the on-screen text (legacy basic Latin table only).
font8x8 = { version = "0.3.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
wgpu = "30.0.1"
# The naga version wgpu 30 uses (shader validation for user shaders).
naga = { version = "30.0.1", features = ["wgsl-in"] }
cpal = "0.18.2"
criterion = "0.8.2"
crossbeam-channel = "0.5.17"
proptest = "1.12.0"
rayon = "1.12.0"
realfft = "3.5.1"
rtrb = "0.4.1"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
# Daily-rotated log files (the app's logs directory).
tracing-appender = "0.2.5"
# Preset hot reload: file watching, debounced.
notify = "8.2.2"
notify-debouncer-mini = { version = "0.7.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
# Window and event loop (Windows only in v1; no X11/Wayland backends).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows-core = "0.62.2"
ms-expr = { path = "crates/ms-expr", version = "0.1.0" }
ms-analysis = { path = "crates/ms-analysis", version = "0.1.0" }
ms-audio = { path = "crates/ms-audio", version = "0.1.0" }
ms-preset = { path = "crates/ms-preset", version = "0.1.0" }
ms-render = { path = "crates/ms-render", version = "0.1.0" }
ms-engine = { path = "crates/ms-engine", version = "0.1.0" }
