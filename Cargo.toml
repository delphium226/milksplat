[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
wgpu = "30.0.1"
# The naga version wgpu 30 uses (shader validation for user shaders).
naga = { version = "30.0.1", features = ["wgsl-in"] }
cpal = "0.18.2"
criterion = "0.8.2"
crossbeam-channel = "0.5.17"
proptest = "1.12.0"
realfft = "3.5.1"
rtrb = "0.4.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
windows-core = "0.62.2"
ms-expr = { path = "crates/ms-expr", version = "0.1.0" }
ms-analysis = { path = "crates/ms-analysis", version = "0.1.0" }
ms-audio = { path = "crates/ms-audio", version = "0.1.0" }
ms-preset = { path = "crates/ms-preset", version = "0.1.0" }
ms-render = { path = "crates/ms-render", version = "0.1.0" }
ms-engine = { path = "crates/ms-engine", version = "0.1.0" }
